# Template for scripts/run_daily_allsubbands.py (date-based, v1 settings). The launcher
# updates date, output_root, and cal.bp; edit the remaining paths for your site.
# The v2 production (LST nightly) settings are listed at the end of this file.

date: "2026-01-01"
hours: ["05", "06", "07", "08", "09", "10"]
bands: [23, 27, 32, 36, 41, 46, 50, 55, 59, 64, 69, 73, 78, 82]
batch_size: 45
batch_timeout_seconds: 21600
max_retries: 1

data_root: /data/measurement_sets
output_root: /products/gsi

cal:
  bp: /calibration/bandpass.B.flagged
  xy: /calibration/xyphase.Xf
  sources: /calibration/sources.json
  aoflagger_strategy: /calibration/aoflagger.lua
  # rfi_sources: /calibration/rfi_model.json   # for peel.rfi (see README)

chanbin: 4
do_aoflag: false
do_badants: true
# Recompute UVW in J2000 after averaging (the raw (u, v) are rotated ~0.34 deg,
# rotating every snapshot image): centroid (default) | time (chgcentre/main
# pipeline epoch, 5 s early) | off.
fix_uvw: centroid

peel:
  maxiter: 30
  tolerance: 1.0e-2
  minuvw: 10.0
  peeliter: 3
  min_source_elevation_deg: 15.0
  require_convergence: true
  max_gain_amplitude: 100.0
  quality_sample_rows: 1024
  min_visibility_amplitude: 1.0e-12
  min_visibility_nonzero_fraction: 0.01
  # v2 production (CPU-TTCal-matched sky + RFI zest): maxiter: 5, tolerance: 1.0e-4,
  # minuvw: 5.0, min_source_elevation_deg: 0.0, require_convergence: false, solver: rk4,
  # model: exact, uvw: geometric, flag_model: true, resubtract: true, fast_io: true,
  # rfi: true, flag_zero: true, residual_guard: true

imaging:
  weight: briggs
  robust: 0
  taper_inner_tukey: 30

movie:
  enabled: true
  max_px: 512
  fps: 20
  crf: 28
  scale_mode: adaptive_i
  fixed_vmax: 20
  rms_scale: 10.0
  horizon_mask: true
  horizon_radius_fraction: 0.49
  keep_frames: false

env:
  conda_env: /opt/gsi/envs/runtime
  dev_env: /opt/gsi/envs/development
  julia_bin: /opt/julia/bin
  ttcalx: /opt/TTCalX
  shared_depot: /opt/julia-depot

# v2 production (scripts/run_nightly_lst.py template) also sets, besides the peel: values above:
#   layout: lst                      run_label / lst_hours / date: filled in by run_nightly_lst.py
#   snapshot_phase_centre: lst       bands: [18, 23, ..., 82]   batch_size: 360
#   batch_timeout_seconds: 7200      prep: numpy
#   keep_ms_root: <output_root>/_kept_ms     stream_hour_images: true   wideband_per_hour: true
#   calcache_cleanup: none           nightly_wait_all: true (read by run_nightly_lst.py)
#   imaging: {imager: ttcalx, mode: clean, abs_mem: 20, retries: 1}
#   hour_imaging: {ttcalx_image: <imager venv>/bin/ttcalx-image, qa: none,
#                  timeout_seconds: 7200, delete_kept_ms: true}
# v3 (opt-in): the peel: and v3: lines in README.md ("v3: in-memory band-hour").
