control:
  state_dir: /lustre/pipeline/snapshots_gpu_pipeline/_state
defaults:
  zest_recycle_files: 0      # v3.zest_persistent needs 0 (the per-GPU daemon is never recycled)
  max_feeders: 16            # v5.1 (v5: 8): feeds keep up with lookahead 16 (watch Lustre read load)
  wsclean_threads: 4
  aoflagger_threads: 2
  free_core_budget: 6
  archive_workers: 2
  work_root: /fast/pipeline/gsi_v5_1
nodes:
- alias: lwacalim00
  gpus:
  - 0
  - 1
- alias: lwacalim01
  gpus:
  - 0
  - 1
- alias: lwacalim02
  gpus:
  - 0
  - 1
- alias: lwacalim05
  gpus:
  - 0
  - 1
- alias: lwacalim06
  gpus:
  - 0
  - 1
